name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-linux-gnu
            runner: ubuntu-latest

          # Linux aarch64
          - target: aarch64-linux-gnu
            runner: ubuntu-latest

          # Windows x86_64
          - target: x86_64-windows-gnu
            runner: ubuntu-latest

          # Windows aarch64
          - target: aarch64-windows-gnu
            runner: ubuntu-latest

          # macOS x86_64
          - target: x86_64-macos
            runner: ubuntu-latest

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-macos
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1

      - name: Build
        shell: bash
        run: |
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseFast

      - name: Package artifact
        shell: bash
        run: |
          # Create tarball
          tar -czf "zobscast-${{ matrix.target }}.tar.gz" \
            -C "zig-out" .

          echo "Contents of artifact:"
          tar -tzf "zobscast-${{ matrix.target }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zobscast-${{ matrix.target }}
          path: zobscast-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          # Write to file to avoid quoting issues
          echo "$BODY" > release_notes.md
          echo "body_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zobscast ${{ github.ref_name }}"
          body_path: ${{ steps.changelog.outputs.body_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
