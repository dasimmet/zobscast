name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-linux-gnu
            runner: ubuntu-latest
            artifact_suffix: linux-x86_64
            lib_name: zobscast.so
            install_dir: bin/64bit

          # Linux aarch64
          - target: aarch64-linux-gnu
            runner: ubuntu-latest
            artifact_suffix: linux-aarch64
            lib_name: zobscast.so
            install_dir: bin/64bit

          # Windows x86_64
          - target: x86_64-windows-gnu
            runner: ubuntu-latest
            artifact_suffix: windows-x86_64
            lib_name: zobscast.dll
            install_dir: bin/64bit

          # macOS x86_64
          - target: x86_64-macos
            runner: macos-13
            artifact_suffix: macos-x86_64
            lib_name: zobscast.dylib
            install_dir: bin

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-macos
            runner: macos-14
            artifact_suffix: macos-aarch64
            lib_name: zobscast.dylib
            install_dir: bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1

      - name: Build
        shell: bash
        run: |
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseFast \
            --prefix zig-out

      - name: Package artifact
        shell: bash
        run: |
          ARTIFACT_DIR="package-${{ matrix.artifact_suffix }}"
          mkdir -p "${ARTIFACT_DIR}/bin/64bit"
          mkdir -p "${ARTIFACT_DIR}/data"

          # Copy library
          LIB_PATH=$(find zig-out -name "${{ matrix.lib_name }}" | head -1)
          if [ -z "$LIB_PATH" ]; then
            echo "ERROR: Could not find ${{ matrix.lib_name }} in zig-out"
            find zig-out -type f
            exit 1
          fi
          cp "$LIB_PATH" "${ARTIFACT_DIR}/${{ matrix.install_dir }}/${{ matrix.lib_name }}"

          # Copy locale data
          cp -r data "${ARTIFACT_DIR}/"

          # Create tarball
          tar -czf "zobscast-${{ matrix.artifact_suffix }}.tar.gz" \
            -C "${ARTIFACT_DIR}" .

          echo "Contents of artifact:"
          tar -tzf "zobscast-${{ matrix.artifact_suffix }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zobscast-${{ matrix.artifact_suffix }}
          path: zobscast-${{ matrix.artifact_suffix }}.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          # Write to file to avoid quoting issues
          echo "$BODY" > release_notes.md
          echo "body_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zobscast ${{ github.ref_name }}"
          body_path: ${{ steps.changelog.outputs.body_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
