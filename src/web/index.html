<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="Title">Zobscast Settings</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="header">
    <div class="title-group">
      <svg class="cast-icon" viewBox="0 0 24 24">
        <path
          d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
      </svg>
      <h1 class="title" data-i18n="Title">Zobscast Settings</h1>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span> <span id="statusText" data-i18n="Status.Inactive">Inactive</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="Destination.Title">Cast Destination</div>
    <div class="form-row">
      <label class="form-label" for="deviceSelect" data-i18n="Destination.FoundDevice">Found Device</label>
      <div class="form-control">
        <select id="deviceSelect">
          <option value="" data-i18n="Destination.Scanning">Scanning devices...</option>
        </select>
        <button id="scanBtn" class="btn btn-secondary" style="flex-shrink:0;" data-i18n="Destination.Scan">Scan</button>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" for="sinkInput" data-i18n="Destination.IpAddress">IP Address</label>
      <div class="form-control">
        <input type="text" id="sinkInput" data-i18n-placeholder="Destination.IpPlaceholder"
          placeholder="e.g. 192.168.1.100 or device name">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" for="portInput" data-i18n="Destination.Port">Port</label>
      <div class="form-control">
        <input type="number" id="portInput" min="1" max="65535" step="1" value="8009" placeholder="8009">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="Encoding.Title">Video &amp; Encoding</div>
    <div class="form-row">
      <label class="form-label" data-i18n="Encoding.EnableVideo">Video Stream</label>
      <div class="form-control">
        <label class="toggle-switch">
          <input type="checkbox" id="enableVideo" checked>
          <div class="switch-track">
            <div class="switch-thumb"></div>
          </div>
          <span style="font-size:12px; color:var(--text-secondary);" data-i18n="Encoding.EnableVideoDesc">Stream OBS
            canvas video</span>
        </label>
      </div>
    </div>
    <div class="form-row" id="bitrateRow">
      <label class="form-label" for="bitrateInput" data-i18n="Encoding.Bitrate">Bitrate</label>
      <div class="form-control">
        <input type="number" id="bitrateInput" min="500" max="50000" step="250" value="2500">
        <span class="input-suffix" data-i18n="Encoding.BitrateSuffix">kbps</span>
      </div>
    </div>
    <div class="form-row" id="presetRow">
      <label class="form-label" for="presetSelect" data-i18n="Encoding.Preset">Preset</label>
      <div class="form-control">
        <select id="presetSelect">
          <option value="ultrafast" data-i18n="Encoding.Preset.Ultrafast">ultrafast (lowest delay)</option>
          <option value="superfast" data-i18n="Encoding.Preset.Superfast">superfast</option>
          <option value="veryfast" data-i18n="Encoding.Preset.Veryfast">veryfast (recommended)</option>
          <option value="faster" data-i18n="Encoding.Preset.Faster">faster</option>
          <option value="fast" data-i18n="Encoding.Preset.Fast">fast</option>
          <option value="medium" data-i18n="Encoding.Preset.Medium">medium</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="Audio.Title">Audio</div>
    <div class="form-row">
      <label class="form-label" data-i18n="Audio.EnableAudio">Audio Stream</label>
      <div class="form-control">
        <label class="toggle-switch">
          <input type="checkbox" id="enableAudio" checked>
          <div class="switch-track">
            <div class="switch-thumb"></div>
          </div>
          <span style="font-size:12px; color:var(--text-secondary);" data-i18n="Audio.EnableAudioDesc">Stream OBS master
            audio</span>
        </label>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="Diagnostics.Title">Diagnostics</div>
    <div class="form-row">
      <label class="form-label" data-i18n="Diagnostics.VerboseLogging">Verbose Logging</label>
      <div class="form-control">
        <label class="toggle-switch">
          <input type="checkbox" id="debugLog">
          <span class="switch-track">
            <span class="switch-thumb"></span>
          </span>
          <span style="font-size:12px; color:var(--text-secondary);" data-i18n="Diagnostics.VerboseLoggingDesc">Log
            video packet stats to OBS log</span>
        </label>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="toggleBtn" class="btn btn-secondary" data-i18n="Actions.Start">Start Casting</button>
    <button id="saveBtn" class="btn btn-primary" disabled data-i18n="Actions.Save">Save Settings</button>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>

</html>
