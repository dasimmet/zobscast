<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zobscast Settings</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="header">
    <div class="title-group">
      <svg class="cast-icon" viewBox="0 0 24 24">
        <path
          d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
      </svg>
      <h1 class="title">Zobscast Settings</h1>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span> Inactive
    </div>
  </div>

  <div class="card">
    <div class="card-title">Cast Destination</div>
    <div class="form-row">
      <label class="form-label" for="deviceSelect">Found Device</label>
      <div class="form-control">
        <select id="deviceSelect">
          <option value="">Scanning devices...</option>
        </select>
        <button id="scanBtn" class="btn btn-secondary" style="flex-shrink:0;">Scan</button>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" for="sinkInput">IP Address</label>
      <div class="form-control">
        <input type="text" id="sinkInput" placeholder="e.g. 192.168.1.100 or device name">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Video &amp; Encoding</div>
    <div class="form-row">
      <label class="form-label" for="bitrateInput">Bitrate</label>
      <div class="form-control">
        <input type="number" id="bitrateInput" min="500" max="50000" step="250" value="2500">
        <span class="input-suffix">kbps</span>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" for="presetSelect">Preset</label>
      <div class="form-control">
        <select id="presetSelect">
          <option value="ultrafast">ultrafast (lowest delay)</option>
          <option value="superfast">superfast</option>
          <option value="veryfast">veryfast (recommended)</option>
          <option value="faster">faster</option>
          <option value="fast">fast</option>
          <option value="medium">medium</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Diagnostics</div>
    <div class="form-row">
      <label class="form-label">Verbose Logging</label>
      <div class="form-control">
        <label class="toggle-switch">
          <input type="checkbox" id="debugLog">
          <div class="switch-track">
            <div class="switch-thumb"></div>
          </div>
          <span style="font-size:12px; color:var(--text-secondary);">Log video packet stats to OBS log</span>
        </label>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="toggleBtn" class="btn btn-secondary">Start Casting</button>
    <button id="saveBtn" class="btn btn-primary">Save Settings</button>
  </div>

  <div id="toast" class="toast">Settings saved!</div>

  <script src="/app.js"></script>
</body>

</html>
